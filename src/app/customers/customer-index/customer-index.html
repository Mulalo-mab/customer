<div class="customer-index-container">
  <!-- Header Section -->
  <div class="header-section mb-3">
    <div class="row align-items-center">
      <div class="col-md-6">
        <h2 class="mb-0">Customer Management</h2>
      </div>
      <div class="col-md-6 text-end">
        <button class="btn btn-primary me-2" (click)="goToCreate()">
          <i class="bi bi-plus-circle"></i> Create New Customer
        </button>
        <button class="btn btn-outline-secondary" (click)="refreshData()">
          <i class="bi bi-arrow-clockwise"></i> Refresh
        </button>
      </div>
    </div>
  </div>

  <!-- Search and Filter Section -->
  <div class="search-section mb-3">
    <div class="row g-2">
      <div class="col-md-4">
        <div class="input-group">
          <input type="text" class="form-control" placeholder="Search customers..."
                 [(ngModel)]="searchTerm" (keyup.enter)="onSearch()">
          <button class="btn btn-outline-secondary" type="button" (click)="onSearch()">
            <i class="bi bi-search"></i>
          </button>
          <button class="btn btn-outline-secondary" type="button" (click)="clearSearch()">
            <i class="bi bi-x-circle"></i>
          </button>
        </div>
      </div>
      <div class="col-md-3">
        <select class="form-select" [(ngModel)]="selectedStatus" (change)="onSearch()">
          <option value="">All Statuses</option>
          <option value="Active">Active</option>
          <option value="Pending">Pending</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
      <div class="col-md-3">
        <select class="form-select" [(ngModel)]="selectedAssignedTo" (change)="onSearch()">
          <option value="">All Users</option>
          <option value="Shafeka Moosa">Shafeka Moosa</option>
          <option value="John Smith">John Smith</option>
          <option value="Sarah Johnson">Sarah Johnson</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="text-center py-4">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="mt-2">Loading customers...</p>
  </div>

  <!-- AG Grid -->
  <div *ngIf="!isLoading" class="ag-theme-alpine grid-container">
    <ag-grid-angular style="width: 100%; height: 600px;"
                     class="ag-theme-alpine"
                     [rowData]="gridData"
                     [columnDefs]="columnDefs"
                     [defaultColDef]="defaultColDef"
                     [gridOptions]="gridOptions"
                     (gridReady)="onGridReady($event)"
                     (rowDoubleClicked)="onRowDoubleClicked($event)"
                     (cellClicked)="onCellClicked($event)"
                     animateRows="true"
                     enableCellTextSelection="true"
                     ensureDomOrder="true">
    </ag-grid-angular>
  </div>

  <!-- No Data Message -->
  <div *ngIf="!isLoading && gridData.length === 0" class="text-center py-4">
    <p class="text-muted">No customers found.</p>
    <button class="btn btn-primary" (click)="goToCreate()">
      <i class="bi bi-plus-circle"></i> Create First Customer
    </button>
  </div>
</div>
