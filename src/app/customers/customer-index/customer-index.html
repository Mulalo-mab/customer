<!-- Create New Link -->
<div class="row mb-2">
  <div class="col">
    <p class="mb-0">
      <a href="customer/create" class="create-new-link">
        Create New
      </a>
    </p>
  </div>
</div>

<div class="panel panel-info custom-panel">
  <div class="panel-heading custom-panel-heading">
    <div class="container-fluid">
      <!-- Index Header -->
      <div class="row align-items-center">
        <div class="col">
          <h2 class="mb-0 panel-title">Index</h2>
        </div>
      </div>
    </div>
  </div>

  <div class="panel-body custom-panel-body">
    <div class="container-fluid">
      <!-- Fixed inline layout for controls -->
      <div class="controls-container">
        <!-- Left side: Toggle + Page -->
        <div class="left-controls">
          <!-- Toggle -->
          <div class="toggle-container">
            <input id="hActive" name="Active" type="hidden" value="Y">
            <div class="toggle btn btn-success btn-xs" data-toggle="toggle" style="width: 100%; height: 21.6px;">
              <input name="IsActive" checked id="IsActive" type="checkbox" data-toggle="toggle"
                     data-on="Show Active" data-off="Show Archive" data-width="100%"
                     data-onstyle="success" data-size="mini" data-offstyle="warning">
              <div class="toggle-group">
                <label class="btn btn-success btn-xs toggle-on">Show Active</label>
                <label class="btn btn-warning btn-xs active toggle-off">Show Archive</label>
                <span class="toggle-handle btn btn-default btn-xs"></span>
              </div>
            </div>
          </div>

          <!-- Page Dropdown - FIXED -->
          <div class="page-selector" style="display: flex; align-items: center; gap: 8px;">
            <span class="page-label fw-bold" style="white-space: nowrap; color: #333; font-size: 14px;">
              Page(s):
            </span>
            <select class="form-select form-select-sm" style="width: 70px;">
              <option>5</option>
              <option>10</option>
              <option>20</option>
            </select>
          </div>
        </div>

        <!-- Right side: Search -->
        <div class="right-controls">
          <div class="input-group" style="width: 350px;">
            <input type="text" class="form-control" placeholder="Search Companys Name" aria-label="Search" aria-describedby="search-button">
            <div class="input-group-append">
              <button class="btn btn-success" type="button" id="search-button">
                Search
              </button>
            </div>
          </div>
        </div>
      </div>


      <!-- AG Grid -->
      <ag-grid-angular class="ag-theme-quartz"
                       style="height: 500px; width: 100%;"
                       [rowData]="rowData"
                       [columnDefs]="colDefs">
      </ag-grid-angular>

      <!-- Bottom Pagination -->
      <div class="d-flex justify-content-between align-items-center mt-3">
        <!-- Page info -->
        <div class="fw-bold">
          Page {{currentPage}} of {{totalPages}}
        </div>

        <!-- Pagination controls -->
        <div class="pagination-container">
          <ul class="pagination pagination-sm">
            <!-- Page numbers -->
            <li class="page-item" [class.active]="page === currentPage" *ngFor="let page of visiblePages">
              <a class="page-link" href="javascript:void(0)" (click)="goToPage(page)">{{page}}</a>
            </li>

            <!-- Next button -->
            <li class="page-item PagedList-skipToNext" [class.disabled]="currentPage === totalPages">
              <a class="page-link" href="javascript:void(0)" (click)="goToPage(currentPage + 1)">
                &raquo;
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
